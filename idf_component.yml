version: "0.1.0"
description: "Portable C++17 library foundation for TI TMP116, TMP117 and TMP119 temperature sensors."
license: "MIT"
url: "https://github.com/janhavelka/TMP11x"
repository: "https://github.com/janhavelka/TMP11x.git"
maintainers:
  - "Jan Havelka (THYMOS Solution s.r.o.) <info@thymos.cz>"
files:
  exclude:
    - "**/*"
  include:
